name: Build Windows editor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'visual-editor.html'
      - 'visual-editor.js'
      - 'visual-editor.css'
      - 'visual-elements.js'
      - 'visual-elements.json'
      - 'index.html'
      - 'radio-v51.css'
      - 'radio-v51.js'
      - 'radio-v51-core.js'
      - 'music-player.css'
      - 'music-player.js'
      - 'cloud-backup.js'
      - 'vendor/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Syntax checks
        working-directory: desktop
        run: npm run check

      - name: Build Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Radio-Interface-Studio-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
