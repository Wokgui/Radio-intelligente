name: Build App Interface Studio

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'visual-editor.html'
      - 'app-runtime.html'
      - 'visual-editor.js'
      - 'visual-editor.css'
      - '.github/workflows/build-desktop.yml'
  push:
    branches:
      - main
      - 'feature/interface-studio-*'
    paths:
      - 'desktop/**'
      - 'visual-editor.html'
      - 'app-runtime.html'
      - 'visual-editor.js'
      - 'visual-editor.css'
      - 'visual-elements.js'
      - 'visual-elements.json'
      - 'index.html'
      - 'radio-v51.css'
      - 'radio-v51.js'
      - 'radio-v51-core.js'
      - 'music-player.css'
      - 'music-player.js'
      - 'cloud-backup.js'
      - 'vendor/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Syntax checks
        working-directory: desktop
        run: npm run check

      - name: Build Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: App-Interface-Studio-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable Windows download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json
          $version = $package.version
          $tag = "app-interface-studio-v$version"
          $title = "App Interface Studio v$version"
          $file = Get-ChildItem "desktop/dist/*.exe" | Select-Object -First 1
          $notes = "Build stable d’App Interface Studio $version. Le détail des changements est disponible dans l’historique Git et la Pull Request associée."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file.FullName --clobber
          } else {
            gh release create $tag $file.FullName --target "${{ github.sha }}" --title $title --notes $notes
          }
