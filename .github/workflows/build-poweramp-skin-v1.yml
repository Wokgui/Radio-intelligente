name: Build Poweramp Skin V1

on:
  push:
    branches:
      - poweramp-skin-v1-build
    paths:
      - 'poweramp-v1/**'
      - '.github/workflows/build-poweramp-skin-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout V1 branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Clone official Poweramp skin SDK
        run: git clone --depth 1 https://github.com/maxmpz/powerampapi.git upstream

      - name: Inspect Poweramp 1026 background resources
        run: |
          mkdir -p ref1026
          unzip -q upstream/Poweramp-build-1026-resources.zip -d ref1026
          echo '=== files mentioning colorBgInverse / windowBackground / ActivityTheme_Black ==='
          grep -R -n -E 'colorBgInverse|windowBackground|ActivityTheme_Black|colorBackground' ref1026/res 2>/dev/null | head -n 500 || true
          echo '=== likely player/root background style references ==='
          grep -R -n -E 'TopContainer|activity_main|scene_aa|background' ref1026/res/values* 2>/dev/null | grep -E 'background|colorBg|ActivityTheme|TopContainer' | head -n 500 || true

      - name: Configure local Android SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > upstream/local.properties

      - name: Apply Hugo Poweramp V1 overlay
        run: |
          cp poweramp-v1/overlay/res/xml/skins.xml upstream/poweramp_skin_sample/src/main/res/xml/skins.xml
          cp poweramp-v1/overlay/res/values/hugo_skin.xml upstream/poweramp_skin_sample/src/main/res/values/hugo_skin.xml
          cp poweramp-v1/overlay/res/values/hugo_strings.xml upstream/poweramp_skin_sample/src/main/res/values/hugo_strings.xml
          sed -i 's#<string name="app_name">Poweramp v3 Skin Sample</string>#<string name="app_name">Hugo Poweramp V1</string>#' upstream/poweramp_skin_sample/src/main/res/values/strings.xml

      - name: Build installable debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :poweramp_skin_sample:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          APK="$(find upstream/poweramp_skin_sample/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Hugo-Poweramp-V1.apk
          ls -lh Hugo-Poweramp-V1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hugo-Poweramp-V1
          path: Hugo-Poweramp-V1.apk
          if-no-files-found: error
          retention-days: 30
