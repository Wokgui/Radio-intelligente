name: Build Poweramp Skin V1

on:
  push:
    branches:
      - poweramp-skin-v1-build
    paths:
      - 'poweramp-v1/**'
      - '.github/workflows/build-poweramp-skin-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout V1 branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Clone official Poweramp skin SDK
        run: git clone --depth 1 https://github.com/maxmpz/powerampapi.git upstream

      - name: Dump actual Poweramp 1026 resource table
        run: |
          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          cp upstream/Poweramp-build-1026-resources.zip Poweramp-1026.apk
          "$AAPT2" dump resources Poweramp-1026.apk > poweramp-resources-full.txt
          {
            echo '=== RESOURCE TABLE MATCHES: BACKGROUND / MAIN PLAYER ==='
            grep -n -E -C 18 'colorBgInverse|colorBg|windowBackground|ActivityTheme_Black|ActivityTheme_White|Base_ActivityTheme|TopContainer|scene_aa|playerBackground|mainBackground|background' poweramp-resources-full.txt | head -n 12000 || true
            echo
            echo '=== RESOURCE NAMES WITH COLOR / BG ==='
            grep -E '^resource .*:(attr|color|style|drawable)/' poweramp-resources-full.txt | grep -Ei 'color|bg|background|topcontainer|scene_aa|player' | head -n 5000 || true
          } > poweramp-background-report.txt
          wc -l poweramp-resources-full.txt poweramp-background-report.txt

      - name: Upload background inspection report
        uses: actions/upload-artifact@v4
        with:
          name: Poweramp-Background-Report
          path: |
            poweramp-background-report.txt
            poweramp-resources-full.txt
          if-no-files-found: error
          retention-days: 7

      - name: Configure local Android SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > upstream/local.properties

      - name: Apply Hugo Poweramp V1 overlay
        run: |
          cp poweramp-v1/overlay/res/xml/skins.xml upstream/poweramp_skin_sample/src/main/res/xml/skins.xml
          cp poweramp-v1/overlay/res/values/hugo_skin.xml upstream/poweramp_skin_sample/src/main/res/values/hugo_skin.xml
          cp poweramp-v1/overlay/res/values/hugo_strings.xml upstream/poweramp_skin_sample/src/main/res/values/hugo_strings.xml
          sed -i 's#<string name="app_name">Poweramp v3 Skin Sample</string>#<string name="app_name">Hugo Poweramp V1</string>#' upstream/poweramp_skin_sample/src/main/res/values/strings.xml

      - name: Build installable debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :poweramp_skin_sample:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          APK="$(find upstream/poweramp_skin_sample/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Hugo-Poweramp-V1.apk
          ls -lh Hugo-Poweramp-V1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hugo-Poweramp-V1
          path: Hugo-Poweramp-V1.apk
          if-no-files-found: error
          retention-days: 30
